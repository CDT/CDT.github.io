name: Sync resume PDF

on:
    push:
        branches:
            - main
        paths:
            - files/Resume.md
            - scripts/generate-resume-pdf.mjs
            - .github/workflows/sync-resume-pdf.yml
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate-pdf:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Pandoc
              run: sudo apt-get update && sudo apt-get install --yes pandoc

            - name: Generate PDF from Markdown
              run: node scripts/generate-resume-pdf.mjs

            - name: Commit synchronized PDF
              run: |
                  if git diff --quiet -- files/Resume.pdf; then
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add files/Resume.pdf
                  git commit -m "Sync resume PDF"
                  git push
