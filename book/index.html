<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Cards</title>
  <link rel="stylesheet" href="styles.css">
  <script src="card-content.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="./">
        <span class="deck-mark" aria-hidden="true"></span>
        Knowledge Cards
      </a>
      <a class="download" href="book.epub" download>Download EPUB</a>
    </div>
  </header>

  <main class="library">
    <div class="library-heading">
      <h1>Card library</h1>
      <p id="deck-total"></p>
    </div>
    <div class="layout">
      <aside class="sidebar" aria-label="Card browser">
        <label for="search">Find a card</label>
        <input type="search" id="search" placeholder="Search titles" autocomplete="off">
        <label for="category">Category</label>
        <div class="select-wrap">
          <select id="category">
            <option value="">All categories</option>
            <option value="vocabulary">Vocabulary</option>
            <option value="citations">Citations</option>
            <option value="knowledge">Philosophy &amp; history</option>
          </select>
        </div>
        <ul id="card-list" aria-label="Matching cards"></ul>
      </aside>

      <section class="reader" aria-label="Card viewer">
        <div class="reader-bar">
          <span id="position" aria-live="polite"></span>
          <div class="reader-controls">
            <button type="button" id="previous" disabled>Previous</button>
            <button type="button" id="next" disabled>Next</button>
          </div>
        </div>
        <p id="message" role="status">Loading cards…</p>
        <article id="card" class="card-content" hidden></article>
      </section>
    </div>
  </main>
</body>
</html>
